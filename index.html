<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin" />
  <!-- Échelle NORMALE (1) : l'app était forcée à 85 %, donc tout était rétréci
       (des textes de 11-12 px s'affichaient à ~10 px) — d'où l'impression de page
       web tassée. Le zoom n'est plus bloqué non plus : le désactiver est un
       anti-patron d'accessibilité (et c'est signalé par les audits). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VRM" />
  <!-- Couleur de l'interface système (barre du navigateur / PWA sur iPhone).
       ⚠️⚠️ ELLE SUIVAIT LA PRÉFÉRENCE DU SYSTÈME, PAS LE CHOIX DE L'APP.
       Le mode sombre de VRM est un CHOIX, rangé dans `vinted_dark` (§7 :
       « mode sombre choisi, pas inversé automatiquement »). Avec les deux
       balises `prefers-color-scheme` d'avant, un téléphone en clair + une app
       en sombre donnait une barre d'état BLANC CASSÉ au-dessus d'une app noire
       — mesuré : `theme-color = #F5F8F6` alors que les cartes étaient à
       `rgb(26,31,39)`. Une seule balise, sans `media`, pilotée par le choix. -->
  <meta name="theme-color" content="#F2F2F7" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/vrm-apple-touch-icon-v5.png" />
  <link rel="icon" type="image/png" href="/vrm-icon-v5-192.png" />
  <!-- Connexion anticipée à Supabase : le tout premier chargement de données
       (comptes, moisson) démarre son handshake TLS pendant que le JS se parse. -->
  <link rel="preconnect" href="https://lgonxzrzjcqthjtbdpzo.supabase.co" crossorigin />
  <!-- ⚠️ 30 sept. : les polices ne viennent PLUS de Google (IP des visiteurs
       transmise à un tiers) — elles sont servies par le site (src/main.jsx).
       Police chargée SANS bloquer l'affichage : la page s'affiche tout de suite
       avec la police système, puis bascule sur Inter une fois prête (display=swap).
       Le média « print » rend le lien non-bloquant, l'onload le réactive. -->
  <!-- ⚠️ DEUX POLICES, ET C'EST VOULU. Julien : « on dirait fait par une IA ».
       Le tell n°1 d'une interface générée, c'est UNE SEULE police neutre
       (Inter) à toutes les tailles : rien ne distingue un titre d'un
       paragraphe autre que la taille. Un vrai produit oppose une police
       d'AFFICHAGE (titres, montants) à une police de TEXTE (le reste).
       Bricolage Grotesque a du caractère (terminaisons coupées, chiffres
       larges) sans être fantaisiste — et elle est superbe en gros chiffre,
       ce que cette app affiche partout. -->
  <title>VRM — tes ventes, tes colis et ta compta, au même endroit</title>
  <!-- SEO page d'accueil publique (26 oct. ; 11 nov., lot accueil-public : pour
       TOUT revendeur, plus seulement les sneakers). L'app est derrière
       connexion ; seule l'accueil `/` et les pages légales (fichiers séparés)
       sont publiques. Le canonical pointe `/` : les routes applicatives
       (?tab=…) servent ce même index.html et ne doivent pas être indexées à part.
       L'image de partage (1200 × 630) est une vraie capture de l'app en MODE
       EXEMPLE (scripts/accueil-og.cjs, empreinte dans public/og-vrm.json). -->
  <meta name="description" content="L’outil des revendeurs Vinted, Leboncoin et eBay : ventes, colis à envoyer et à retirer, codes de retrait, numéros de rangement, offres et compta URSSAF, au même endroit." />
  <link rel="canonical" href="https://vrm.center/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="VRM" />
  <meta property="og:title" content="VRM — tes ventes, tes colis et ta compta, au même endroit" />
  <meta property="og:description" content="Pour les revendeurs Vinted, Leboncoin et eBay — vêtements, chaussures, sacs, tout ce qui se revend." />
  <meta property="og:url" content="https://vrm.center/" />
  <meta property="og:image" content="https://vrm.center/og-vrm.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VRM : tes ventes, tes colis et ta compta, au même endroit — à côté, l’écran Ma journée de l’app sur des données d’exemple." />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Données structurées (11 nov.) : un BLOC DE DONNÉES (type application/ld+json),
       jamais exécuté — la CSP ne s'y applique pas (scripts/audit-csp.cjs l'admet
       à cette seule condition). ⚠️ Aucun avis, aucune note (aggregateRating,
       review : interdits, il n'y en a pas). Les prix = PRIX_MOIS / PRIX_PRO_MOIS
       (src/accueil-reglages.js) — le banc accueil compare. -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"VRM","url":"https://vrm.center/","applicationCategory":"BusinessApplication","operatingSystem":"Web, iOS, Android","inLanguage":"fr-FR","description":"L’outil des revendeurs Vinted, Leboncoin et eBay : ventes, colis, codes de retrait, numéros de rangement, offres et compta URSSAF, au même endroit.","image":"https://vrm.center/og-vrm.jpg","offers":[{"@type":"Offer","name":"Solo","price":"16.99","priceCurrency":"EUR","url":"https://vrm.center/#prix"},{"@type":"Offer","name":"Pro","price":"19.99","priceCurrency":"EUR","url":"https://vrm.center/#prix"}]}</script>
  <!-- ⚠️ AVANT LE PREMIER RENDU, sinon l'app s'affiche en clair puis bascule.
       On lit le MÊME réglage que React (`vinted_dark`) et on estampille la
       racine : le CSS ci-dessous et la barre d'état suivent aussitôt. Trois
       lignes, aucune dépendance, et un `try` parce qu'un navigateur qui
       refuse le stockage ne doit pas empêcher l'app de démarrer (§4.1). -->
  <!-- ⚠️ Un FICHIER, plus un script en ligne : la politique de sécurité du
       contenu (vercel.json) refuse tout script en ligne. -->
  <script src="/demarrage-theme.js"></script>
  <style>
    body{margin:0;padding:0;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
    /* Le fond n'est plus uniforme : un dégradé très léger vers le haut donne de
       la matière derrière les cartes blanches. À peine perceptible isolément,
       mais c'est ce qui fait la différence entre « feuille de papier » et
       « écran d'application ». */
    body{background-image:none;}
    /* ⚠️ LE CHOIX DE L'APP GAGNE SUR LA PRÉFÉRENCE DU SYSTÈME. `data-theme` est
       posé par le script de démarrage ci-dessous (donc AVANT le premier
       rendu), et sa spécificité passe devant la règle `body` du média.
       ⚠️ Et la teinte est celle de `THEMES.dark.bg` (#122329) : le média
       utilisait #0E1116, une TROISIÈME valeur de fond sombre dans le projet. */
    html[data-theme="dark"]  body{ background:#000000; background-image:none; }
    html[data-theme="light"] body{ background:#FFFFFF; background-image:none; }
    /* `color-scheme` habille les champs NATIFS (date, sélecteurs, ascenseurs).
       Il n'était posé nulle part : la date d'« Import des emails » dans
       Réglages s'affichait en boîte blanche au milieu de l'app sombre. */
    html[data-theme="dark"]  { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    @media (prefers-color-scheme: dark){ body{background:#000000;background-image:none;} }
    *{-webkit-tap-highlight-color:transparent;}
    /* ── COURBES & DURÉES, nommées UNE fois (cohésion : une app « composée »
       réutilise les mêmes ressorts partout au lieu d'en réinventer à chaque
       règle). --vrm-ease-ios était déjà la courbe de l'appui et des feuilles ;
       --vrm-ease-out est la courbe d'ENTRÉE (sortie douce, sans rebond). */
    :root{
      --vrm-ease-ios:cubic-bezier(.32,.72,0,1);
      --vrm-ease-out:cubic-bezier(.22,1,.36,1);
      --vrm-dur-appui:.12s; --vrm-dur-etat:.2s; --vrm-dur-ecran:.28s;
    }
    /* ⚠️ LATENCE DU TOUCHER : sans `touch-action:manipulation`, iOS attend
       ~300 ms après chaque tap (au cas où ce serait un double-tap pour zoomer).
       `manipulation` garde le pan ET le pincer-pour-zoomer (le zoom du viewport,
       gardé pour l'accessibilité, reste intact) et ne supprime QUE ce délai :
       chaque bouton répond au doigt sans retard. C'est le détail qui sépare
       « site web » de « app installée » sur son iPhone. */
    button,a[role="button"],a.vrm-btn,input,select,textarea,[role="tab"],[role="switch"]{touch-action:manipulation;}
    /* Un appui long sur un bouton ne doit PAS sélectionner son texte ni ouvrir
       le menu « copier » d'iOS (un bouton n'est pas du texte). Réservé aux
       boutons : les montants, eux, restent copiables. */
    button,a[role="button"]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
    /* ⚠️ COQUE APP-SHELL : la hauteur est bornée à l'écran et c'est le CONTENU
       (`<main>`) qui défile, jamais le document. La barre du bas vit HORS du
       défilement — elle ne peut donc plus « flotter au milieu de l'écran »
       pendant l'inertie du scroll iOS (bug vu en capture, signalé 3 fois), ni
       être décalée par le `zoom` de densité posé sur <html>. Le correctif que
       le dossier désignait comme « le vrai » depuis le début. */
    html,body,#root{height:100%;}
    @keyframes cancaleSkeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}

    /* ── FINITIONS « PREMIUM », valables sur TOUS les écrans ─────────────────
       Ces règles agissent globalement, sans toucher aux styles de chaque écran. */

    /* 1) CHIFFRES ALIGNÉS : les montants et compteurs utilisent des chiffres de
          largeur fixe → les colonnes ne « dansent » plus d'une ligne à l'autre.
          C'est le détail qui distingue une vraie app d'un prototype. */
    body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv05" 1,"ss01" 1;}

    /* 2) RÉPONSE AU TOUCHER : léger enfoncement au clic, comme une app native. */
    button,a[role="button"]{transition:transform var(--vrm-dur-appui) var(--vrm-ease-ios),box-shadow var(--vrm-dur-etat) ease,background-color var(--vrm-dur-etat) ease,border-color var(--vrm-dur-etat) ease,opacity var(--vrm-dur-etat) ease;}
    button:active:not(:disabled),a[role="button"]:active{transform:scale(.97);}

    /* 3) TITRES ET MONTANTS : police d'AFFICHAGE, resserrée.
          Le contraste tenu entre un affichage serré (-0.03em) et des
          micro-étiquettes aérées en capitales (+0.09em) est ce qui fait lire
          « composé par quelqu'un » plutôt que « sorti d'un générateur ». */
    /* (31 oct., direction « Vitrine », son choix) Bricolage Grotesque pour le
       texte ET les titres (auto-hébergée, src/styles-vitrine.css) ; plus de
       Space Grotesk ni de petites étiquettes en capitales espacées. */
    h1,h2,h3,.vrm-display{
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
      letter-spacing:-.02em;
      font-weight:800;
    }
    .vrm-label{
      text-transform:none;letter-spacing:0;font-weight:500;
      font-size:13px;font-family:inherit;
    }

    /* 3 bis-0) UNE LUEUR, PAS UN APLAT.
       Sur grand écran il reste forcément du vide sous le contenu (une journée
       calme a peu à afficher). Un aplat noir qui s'arrête net fait « page pas
       finie » ; une lueur très douce ancrée en haut à gauche donne une source
       de lumière à la page et le vide devient de la respiration.
       Fixe, non cliquable, sous tout le contenu. */
    /* 3 bis-0) PAS DE HALO — LA PAGE EST IMPRIMÉE, PAS ÉCLAIRÉE.
       La lueur radiale d'avant était le tell « dashboard SaaS ». Ici, une
       trame de papier très légère : la page a une matière, pas une source de
       lumière. */
    /* ⚠️ La trame « papier » (des rayures verticales) est RETIRÉE : elle
       appartenait à l'identité beige. Sur un fond ardoise elle se lisait comme
       une salissure. */

    /* Le grain reste — un aplat parfaitement lisse est un tell d'interface
       générée — mais il passe DERRIÈRE les cartes (z-index négatif) au lieu de
       recouvrir toute la page. Sur du blanc, un grain en `multiply` par-dessus
       grisait les cartes : c'est le fond gris qui doit avoir de la matière,
       pas la donnée. */
    /* (31 oct., direction « Vitrine ») Le grain est RETIRÉ : une matière posée
       pour « faire réel » est elle-même devenue un tic de page générée. Le fond
       est un aplat ; ce sont l'écart de ton et le trait fin qui séparent. */

    /* 3 bis) LE GRAIN. Un aplat de couleur parfaitement lisse est le second
       tell d'une interface générée : aucune surface réelle n'est lisse. Une
       trame de bruit à 2,5 % posée sur toute la page (jamais cliquable) casse
       le rendu « CSS pur » sans que personne ne sache dire pourquoi. */
    /* (le grain vit désormais dans body::before, derrière les cartes) */

    /* 3 ter) LES BOUTONS. Julien : « améliore les boutons ».
       Tous les boutons de l'app portent des styles EN LIGNE (une seule
       feuille React) : une règle CSS ne peut pas les repeindre. Mais les
       ÉTATS (`:hover`, `:active`, `:focus-visible`) n'existent pas en style
       en ligne — donc ces règles-ci s'appliquent partout, sans jamais écraser
       une intention de couleur. C'est exactement ce qui manque à une
       interface générée : elle est jolie au repos et morte sous le doigt.
       ⚠️ `:hover` seulement sur les appareils à VRAI survol : sur mobile,
       le survol reste « collé » après un tap et le bouton paraît bloqué. */
    @media (hover:hover) and (pointer:fine){
      button:not(:disabled):hover,a[role="button"]:hover{ filter:brightness(1.06) saturate(1.03); }
    }
    button:not(:disabled):active{ filter:brightness(.94); }
    button:disabled{ cursor:not-allowed; }
    /* Anneau de focus au clavier : visible, aux couleurs de la marque, jamais
       le contour bleu du navigateur. */
    /* ── LES BOUTONS ──────────────────────────────────────────────────────
       ⚠️ MESURÉ AVANT DE TOUCHER À QUOI QUE CE SOIT (561 boutons rendus sur
       5 écrans) : **22 hauteurs différentes**, **22 paddings**, **13 tailles de
       texte** — dont 47 boutons à `13.3333px` (la valeur PAR DÉFAUT du
       navigateur : ils n'héritaient même pas de la police de l'app). C'est
       cette dispersion qui se lit « pas fini », pas la couleur.
       Les boutons de ce fichier portent tous des styles EN LIGNE, qui gagnent
       sur une classe : cette règle ne pose donc que les propriétés que le
       style en ligne ne fixe pas — la police, une hauteur plancher, un
       alignement. Une intention explicite (un mini-bouton d'icône, un gros
       bouton d'action) reste intacte. */
    /* ⚠️ ON NE TOUCHE PAS À `display`. Un `<button>` centre déjà son contenu
       verticalement ET horizontalement par défaut ; le passer en `inline-flex`
       a immédiatement cassé deux choses, vues en capture : les entrées du rail
       de navigation se sont retrouvées CENTRÉES au lieu d'être alignées à
       gauche, et le chiffre cliquable « Coût d'achat » a mis son étiquette, son
       nombre et sa légende SUR UNE SEULE LIGNE. Une hauteur plancher suffit :
       le navigateur centre le contenu tout seul. */
    button, a.vrm-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.005em;
      min-height: 34px;
      /* Un bouton qui répond au doigt sans « sauter » : c'est ce qu'on ressent
         comme du soin. 110 ms — au-delà ça traîne, en deçà ça claque. */
      transition: background-color .11s ease, border-color .11s ease, color .11s ease, box-shadow .11s ease, filter .11s ease;
    }
    /* Les boutons qui ne portent qu'une icône restent compacts. */
    button[aria-label] { min-height: 30px; }

    /* ⚠️ UNE RANGÉE DE PASTILLES : elle DÉFILE sur téléphone, elle REVIENT À
       LA LIGNE sur ordinateur. Sur mobile, laisser retourner à la ligne faisait
       quatre rangées empilées (§5.68) ; sur un écran large, faire défiler
       horizontalement coupe la dernière pastille au bord droit (vu en capture :
       le compte « liliand65… » tronqué) et oblige à un geste que personne ne
       fait à la souris (§5.62). La règle est la MÊME pour les deux — c'est la
       requête média qui tranche, pas un test de largeur en JavaScript.
       ⚠️ Un style EN LIGNE gagne sur une classe : ces deux propriétés doivent
       donc être retirées du `style={{…}}` des rangées concernées. */
    /* L'île d'actions flotte en haut à droite : la ligne de titre lui laisse
       la place, sinon les boutons d'écran passent dessous. */
    /* Sa largeur RÉELLE est publiée par l'app (`--vrm-ile`) : elle change
       avec la pastille « Actions possibles · compte ». 208 px en repli. */
    @media (min-width: 1024px), (min-width: 768px) and (hover: hover) and (pointer: fine){ .vrm-tete-row{ padding-right: var(--vrm-ile, 208px); } }
    /* La phrase des photos Vinted, posée en tête de page sur la coque : même
       réserve (son geste passait sous l'île — revue du 11 octobre). */
    .vrm-sous-ile{ padding-right: 16px; }
    @media (min-width: 1024px), (min-width: 768px) and (hover: hover) and (pointer: fine){ .vrm-sous-ile{ padding-right: var(--vrm-ile, 208px); } }
    /* (30 oct.) L'île FLOTTE (elle n'occupe plus de rangée au-dessus de
       l'écran) : chaque première ligne qui n'est pas un `ScreenHead` lui
       réserve aussi sa place — le résumé d'une plateforme (CA finalisé,
       Disponible…), l'en-tête d'Organisation, de la Communauté, la ligne
       d'état des Réglages (banc edge-tailles). */
    @media (min-width: 1024px), (min-width: 768px) and (hover: hover) and (pointer: fine){
      html .vrm-app-shell .vrm-market-space > .vrm-platform-summary,
      html .vrm-app-shell .ops-entete, html .vrm-app-shell .vrm-cm-entete,
      html .vrm-app-shell .vrm-settings-status{ padding-right: var(--vrm-ile, 208px); }
    }
    .vrm-rangee{ flex-wrap:nowrap; overflow-x:auto; }
    @media (min-width: 1024px), (min-width: 768px) and (hover: hover) and (pointer: fine){ .vrm-rangee{ flex-wrap:wrap; overflow-x:visible; } }
    /* Carrousel photo (dernières ventes) : on fait défiler au doigt sur
       téléphone, une grille sur ordinateur. */
    .vrm-carrousel{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px,46%); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-inline:16px; scrollbar-width:none; margin:0 -16px; padding:0 16px 4px; }
    .vrm-carrousel::-webkit-scrollbar{ display:none; }
    .vrm-carrousel > *{ scroll-snap-align:start; }
    @media (min-width: 1024px), (min-width: 768px) and (hover: hover) and (pointer: fine){ .vrm-carrousel{ grid-auto-flow:row; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); grid-auto-columns:auto; overflow-x:visible; margin:0; padding:0; } }
    :focus-visible{ outline:2px solid rgba(0,113,227,.65); outline-offset:2px; border-radius:8px; }
    @media (prefers-color-scheme: dark){ :focus-visible{ outline-color:rgba(10,132,255,.8); } }

    /* Bouton PRINCIPAL : un dégradé à peine perceptible + un liseré clair en
       haut. C'est ce qui fait qu'un bouton a l'air d'un objet posé sur la page
       plutôt que d'un rectangle colorié. Réservé aux actions qui comptent. */
    /* Bouton PRINCIPAL : un aplat, sans dégradé ni ombre portée (31 oct.,
       « Vitrine ») — le relief « bouton posé » était un tic, pas une
       information. Il se distingue par sa couleur pleine, et c'est le seul. */
    .vrm-btn-primary{ position:relative; overflow:hidden; background-image:none; box-shadow:none; }
    .vrm-btn-primary:active:not(:disabled){ transform:scale(.98); }

    @media (hover:hover) and (pointer:fine){
      *:hover > .vrm-logo-edit{ opacity:1; }
    }

    /* 4) DÉFILEMENT : élastique sur iOS + barres discrètes sur desktop. */
    html{-webkit-text-size-adjust:100%;}
    body{overscroll-behavior-y:none;}
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-thumb{background:rgba(92,102,114,.32);border-radius:999px;border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(92,102,114,.48);border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-track{background:transparent;}

    /* 5) SÉLECTION de texte aux couleurs de la marque. */
    ::selection{background:rgba(0,113,227,.18);}

    /* 6) CHAMPS DE SAISIE : jamais de zoom auto sur iOS (police >= 16px au focus)
          et un anneau propre — les champs trop petits font « site web », pas « app ». */
    /* Les boutons et champs n'héritent PAS de la police par défaut en HTML :
       sans cette règle, certains gardaient la police système et juraient au
       milieu du reste. */
    button,input,textarea,select{font-family:inherit;}
    /* ⚠️ `!important` est INDISPENSABLE : 46 des 105 champs de l'app portent
          leur taille EN LIGNE (style={{fontSize:13}}), et un style en ligne gagne
          sur une règle de feuille — sans lui, cette règle ne s'appliquait à
          presque rien et l'iPhone zoomait la page à chaque champ touché.
          `-webkit-touch-callout` n'existe que sur iOS : rien ne change ailleurs. */
    @supports (-webkit-touch-callout: none){
      input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea,select{font-size:max(16px,1em) !important;}
    }

    /* 7) CHANGEMENT D'ONGLET : le contenu arrive en fondu au lieu d'apparaître
          brutalement — discret, mais c'est ce qui fait « app » plutôt que « site ».
          ⚠️ On anime UNIQUEMENT l'opacité, jamais transform : un transform sur un
          conteneur redéfinit le référentiel des enfants en position:fixed, ce qui
          décalerait les modales. */
    @keyframes cancaleEnter{from{opacity:0}to{opacity:1}}
    /* Arrivée des notifications : léger glissement depuis le bas. */
    @keyframes cancaleToast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    /* Feuille de confirmation : elle monte depuis le bas, comme une feuille iOS,
       au lieu d'apparaître d'un coup au milieu de l'écran. */
    @keyframes cancaleSheet{from{transform:translateY(100%)}to{transform:none}}
    /* Wrapped (rétrospective plein écran) : chaque carte entre en fondu + léger
       zoom, et la barre de progression de la story se remplit. */
    @keyframes wrapPop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
    @keyframes wrapBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    /* ⚠️⚠️ `backwards`, JAMAIS `both` (ni `forwards`). Mesuré le 2 octobre : une
       animation d'opacité qui GARDE son état final laisse un contexte
       d'empilement sur l'écran pour toujours. Toutes ses fenêtres (rapport
       comptable, bilan annuel, saisie des prix d'achat… z-index 1000) restaient
       piégées dessous, et sur téléphone la barre du bas (z 60) passait PAR-DESSUS
       leurs boutons : « CSV » et « PDF » étaient introuvables. `backwards` fait
       le même fondu à l'entrée et ne laisse rien une fois fini. */
    /* Courbe d'entrée d'écran : sortie douce (ease-out-quint) plutôt qu'un `ease`
       symétrique — le changement d'onglet « se pose » au lieu de simplement
       apparaître. Opacité SEULE (jamais transform : §commentaire plus haut sur
       les enfants position:fixed). */
    main > *{animation:cancaleEnter var(--vrm-dur-ecran) var(--vrm-ease-out) backwards;}

    /* ── CARTES VIVANTES SOUS LE DOIGT ──────────────────────────────────────
       Le même soin que les boutons (jolis au repos, morts sous le doigt),
       étendu aux cartes. Classe OPT-IN `.vrm-card` : une légère élévation au
       survol, SUR SOURIS seulement (sur mobile un survol reste « collé » après
       un tap). §7 : ombre d'ENCRE à deux couches, AUCUNE couleur d'accent — on
       ne peint rien, on soulève. Le repos n'est pas touché (aucun décalage de
       mise en page), donc sans risque sur les écrans déjà composés. */
    /* (31 oct., « Vitrine ») Plus de carte qui se SOULÈVE au survol : sur un
       écran de travail, tout ce qui bouge au passage de la souris est du bruit.
       Le survol fonce le trait de la carte, c'est tout. */
    .vrm-card{transition:border-color var(--vrm-dur-etat) ease;}
    @media (hover:hover) and (pointer:fine){
      .vrm-card:hover{border-color:color-mix(in srgb, var(--vrm-ink, #1D1D1F) 22%, transparent) !important;}
    }

    /* ── CASCADE D'ENTRÉE ────────────────────────────────────────────────────
       Les enfants directs d'un conteneur `.vrm-stagger` arrivent l'un après
       l'autre (fondu + petite montée), UNE fois au montage. À réserver à un
       conteneur monté une fois — pas une liste qui se réordonne en direct
       (sinon ça rejouerait à chaque changement de donnée, §Emil). `backwards`,
       JAMAIS `both` : pas de contexte d'empilement laissé derrière (§comment). */
    /* (31 oct., « Vitrine ») Plus d'entrée en cascade : rien sur un écran de
       travail ne fait son entrée — les blocs sont là, tout de suite. */

    /* 7bis) DÉBORDEMENTS — ⚠️ NE PAS mettre `min-width:0` en règle GLOBALE.
       Essayé, mesuré, ANNULÉ : ça enlève bien le plancher qui fait déborder un
       enfant de flex, mais du coup certains conteneurs s'effondrent à ~0 px et
       le texte se coupe UNE LETTRE PAR LIGNE (constaté sur l'écran Achats :
       « Donne ce code au comptoir » en colonne verticale). Le `min-width:0`
       doit être posé sur LE conteneur précis qui doit rétrécir, avec un enfant
       en `overflow:hidden; text-overflow:ellipsis` — jamais en arrosage.
       Seul le retour à la ligne des mots trop longs est sûr globalement : */
    main { overflow-wrap: break-word; }

    /* 8) IMAGES : jamais déformées, et fondu à l'arrivée plutôt qu'un « pop ». */
    img{max-width:100%;}
    @keyframes cancaleFadeIn{from{opacity:0}to{opacity:1}}
    img[loading="lazy"]{animation:cancaleFadeIn .25s ease both;}

    /* Logo VRM : une rotation 3D d'entrée, UNE seule fois, au montage (demande de
       Julien : « fais-le tourner en 3D / une animation quand VRM charge une
       page »). Un tour complet et discret, puis plus rien — pas de boucle qui
       finirait par agacer. `prefers-reduced-motion` la neutralise (règle ci-bas). */
    @keyframes vrmLogoSpin{from{transform:perspective(420px) rotateY(-200deg) scale(.86);opacity:0}60%{opacity:1}to{transform:perspective(420px) rotateY(0) scale(1);opacity:1}}
    .vrm-logo-anim{animation:vrmLogoSpin .85s cubic-bezier(.22,1,.36,1) both;backface-visibility:hidden;transform-style:preserve-3d;}

    /* Accessibilité : anneau de focus visible seulement au clavier (pas au clic).
       ⚠️ (11 octobre) Il portait encore le VERT de l'ancienne palette menthe
       (#0f6b4f), et, posé après la règle aux couleurs de la marque plus haut,
       il l'écrasait partout : chaque champ qu'il remplit s'entourait de vert
       (vu au rendu, panneau « règle d'offre » d'eBay). §7 : une seule couleur
       d'accent, le bleu de la marque — et le sombre suit le CHOIX (`data-theme`),
       pas la préférence du système. */
    :focus-visible{outline:2px solid rgba(0,113,227,.7);outline-offset:2px;border-radius:8px;}
    :root[data-theme="dark"] :focus-visible{outline-color:rgba(10,132,255,.8);}
    button:focus:not(:focus-visible),a:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible){outline:none;}
    /* Respect du réglage système « réduire les animations ». */
    @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;animation-delay:0ms!important;}button:active:not(:disabled){transform:none!important;}.vrm-card:hover{transform:none!important;}.vrm-stagger > *{animation:none!important;}}
      /* (16 oct.) MODE STREAM : les données sensibles sont floutées, et le
       survol ne les révèle pas (on filme l'écran).
       (5 nov.) Le TEXTE est réécrit « ••• » par la règle programmée
       (src/modeStream.js) ; ici, ce qui n'est pas du texte : les champs dont la
       valeur est à cacher, la LIGNE entière d'une annonce « qui contient… »
       (photo comprise), les bordereaux et les QR des codes de retrait à l'écran
       (selon ses cases), le QR de la double vérification (toujours). */
    [data-stream="1"] [data-stream-flou],
    [data-stream="1"] input[type="email"],
    [data-stream="1"] input[type="tel"] { filter: blur(6px) !important; user-select: none; }
    [data-stream="1"] [data-stream-ligne] { filter: blur(9px) !important; user-select: none; }
    [data-stream="1"][data-stream-bordereaux="1"] [data-stream-image="bordereau"] { filter: blur(14px) !important; }
    [data-stream="1"][data-stream-codes="1"] [data-stream-image="code"],
    [data-stream="1"][data-stream-codes="1"] img[alt^="QR de retrait"],
    [data-stream="1"] [data-mfa-qr] { filter: blur(14px) !important; }
    /* (6 nov.) Les PHOTOS d'article concernées par ses mots (ou toutes, selon son
       réglage) : un flou FORT (une marque sur la chaussure ne se relit pas), gardé
       dans le cadre de la photo (clip-path coupe le halo du flou). L'œil des
       montants (data-stream="m") ne floute que les champs de montant. L'aperçu de
       Réglages → Mode stream (data-apercu-photo) montre CE flou-là, le même. */
    [data-stream="1"] [data-stream-photo],
    [data-apercu-photo="floue"] img { filter: blur(22px) saturate(.7) !important; clip-path: inset(0 round 6px); user-select: none; }
    /* Une photo en GRAND (visionneuse « Agrandir », recadrage du studio : ceux qui
       disent leur article, data-stream-article) : 22 px laissaient la forme d'un
       logo de 700 px se deviner — le flou y est doublé. */
    [data-stream="1"] [data-stream-article] [data-stream-photo],
    [data-stream="1"] [data-stream-article][data-stream-photo] { filter: blur(48px) saturate(.6) !important; }
    [data-stream="m"] [data-stream-flou] { filter: blur(6px) !important; user-select: none; }
</style>
  <!-- (6 nov.) L'ÉCRAN DE DÉMARRAGE — avant tout JavaScript. Julien : « je veux qu'il y
       ait de vrais écrans de chargement ». Il couvre le téléchargement de l'app, la
       vérification de la session et l'ouverture du premier écran ; l'app le retire
       (fondu de 200 ms) quand cet écran est prêt — ou au bout de ~2,5 s, src/demarrage.js.
       Styles EN LIGNE (la CSP les permet, pas les scripts), logo en `data:` (aucune
       requête), fond = celui de la coque (#F2F2F7 / #000), thème déjà posé par
       demarrage-theme.js. Aucune couleur nouvelle : l'encre, à faible opacité. -->
  <style>
    #vrm-demarrage{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#F2F2F7;color:#1D1D1F;opacity:1;transition:opacity .2s cubic-bezier(.22,1,.36,1);font:13px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    html[data-theme="dark"] #vrm-demarrage{background:#000000;color:#F5F5F7}
    #vrm-demarrage[data-sortie]{opacity:0;pointer-events:none}
    #vrm-demarrage .vrm-boot-centre{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-6vh}
    #vrm-demarrage .vrm-boot-logo{display:block;width:72px;height:72px;border-radius:17px;animation:vrmBootLogo .45s cubic-bezier(.22,1,.36,1) both}
    #vrm-demarrage .vrm-boot-rail{position:relative;display:block;width:112px;height:3px;border-radius:99px;overflow:hidden;background:rgba(29,29,31,.10)}
    #vrm-demarrage .vrm-boot-rail>span{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:inherit;background:rgba(29,29,31,.42);animation:vrmBootRail 1.25s cubic-bezier(.45,0,.55,1) infinite}
    html[data-theme="dark"] #vrm-demarrage .vrm-boot-rail{background:rgba(245,245,247,.16)}
    html[data-theme="dark"] #vrm-demarrage .vrm-boot-rail>span{background:rgba(245,245,247,.6)}
    #vrm-demarrage .vrm-boot-mot{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    #vrm-demarrage .vrm-boot-lent{margin:0;min-height:18px;color:#6E6E73;opacity:0;visibility:hidden;animation:vrmBootLent .3s ease 20s forwards}
    html[data-theme="dark"] #vrm-demarrage .vrm-boot-lent{color:#98989D}
    #vrm-demarrage .vrm-boot-lent a{color:#0066CC;font-weight:600;text-decoration:none}
    html[data-theme="dark"] #vrm-demarrage .vrm-boot-lent a{color:#409CFF}
    @keyframes vrmBootRail{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @keyframes vrmBootLogo{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
    @keyframes vrmBootLent{to{opacity:1;visibility:visible}}
    /* Réduire les animations : pas de rail qui court (le mot « Ouverture… » le remplace),
       pas de fondu ; la phrase « connexion lente » garde son délai (la règle globale
       ramène tous les délais à 0, l'identifiant passe devant). */
    @media (prefers-reduced-motion: reduce){
      #vrm-demarrage{transition:none!important}
      #vrm-demarrage .vrm-boot-logo{animation:none!important}
      #vrm-demarrage .vrm-boot-rail{display:none}
      #vrm-demarrage .vrm-boot-mot{position:static;width:auto;height:auto;clip:auto;color:#6E6E73}
      html[data-theme="dark"] #vrm-demarrage .vrm-boot-mot{color:#98989D}
      #vrm-demarrage .vrm-boot-lent{animation:vrmBootLent .001ms linear 20s forwards!important}
    }
  </style>
</head>

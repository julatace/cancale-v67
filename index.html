<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VRM" />
  <meta name="theme-color" content="#007782" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Connexion anticipée à Supabase : le tout premier chargement de données
       (comptes, moisson) démarre son handshake TLS pendant que le JS se parse. -->
  <link rel="preconnect" href="https://lgonxzrzjcqthjtbdpzo.supabase.co" crossorigin />
  <!-- Police chargée SANS bloquer l'affichage : la page s'affiche tout de suite
       avec la police système, puis bascule sur Nunito une fois prête (display=swap).
       Le média « print » rend le lien non-bloquant, l'onload le réactive. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" /></noscript>
  <title>VRM — Vendre · Ranger · Marge</title>
  <style>
    body{margin:0;padding:0;background:#f4f7f5;font-family:'Nunito',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
    *{-webkit-tap-highlight-color:transparent;}
    @keyframes cancaleSkeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}

    /* ── FINITIONS « PREMIUM », valables sur TOUS les écrans ─────────────────
       Ces règles agissent globalement, sans toucher aux styles de chaque écran. */

    /* 1) CHIFFRES ALIGNÉS : les montants et compteurs utilisent des chiffres de
          largeur fixe → les colonnes ne « dansent » plus d'une ligne à l'autre.
          C'est le détail qui distingue une vraie app d'un prototype. */
    body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1;}

    /* 2) RÉPONSE AU TOUCHER : léger enfoncement au clic, comme une app native. */
    button,a[role="button"]{transition:transform .12s cubic-bezier(.32,.72,0,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease;}
    button:active:not(:disabled),a[role="button"]:active{transform:scale(.975);}

    /* 3) TITRES : un poil resserrés, ça pose la hiérarchie. */
    h1,h2,h3{letter-spacing:-.02em;}

    /* 4) DÉFILEMENT : élastique sur iOS + barres discrètes sur desktop. */
    html{-webkit-text-size-adjust:100%;}
    body{overscroll-behavior-y:none;}
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-thumb{background:rgba(120,140,130,.34);border-radius:999px;border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(120,140,130,.5);border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-track{background:transparent;}

    /* 5) SÉLECTION de texte aux couleurs de la marque. */
    ::selection{background:rgba(20,121,90,.18);}

    /* 6) CHAMPS DE SAISIE : jamais de zoom auto sur iOS (police >= 16px au focus)
          et un anneau propre — les champs trop petits font « site web », pas « app ». */
    input,textarea,select{font-family:inherit;}
    @supports (-webkit-touch-callout: none){
      input,textarea,select{font-size:max(16px,1em);}
    }

    /* 7) IMAGES : jamais déformées, et fondu à l'arrivée plutôt qu'un « pop ». */
    img{max-width:100%;}
    @keyframes cancaleFadeIn{from{opacity:0}to{opacity:1}}
    img[loading="lazy"]{animation:cancaleFadeIn .25s ease both;}

    /* Accessibilité : anneau de focus visible seulement au clavier (pas au clic). */
    :focus-visible{outline:3px solid #14795a;outline-offset:2px;border-radius:8px;}
    button:focus:not(:focus-visible),a:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible){outline:none;}
    /* Respect du réglage système « réduire les animations ». */
    @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}button:active:not(:disabled){transform:none!important;}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Échelle NORMALE (1) : l'app était forcée à 85 %, donc tout était rétréci
       (des textes de 11-12 px s'affichaient à ~10 px) — d'où l'impression de page
       web tassée. Le zoom n'est plus bloqué non plus : le désactiver est un
       anti-patron d'accessibilité (et c'est signalé par les audits). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VRM" />
  <!-- Couleur de l'interface système (barre du navigateur / PWA) : alignée sur
       le vert de marque, et adaptée au mode sombre. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7f5" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f0d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Connexion anticipée à Supabase : le tout premier chargement de données
       (comptes, moisson) démarre son handshake TLS pendant que le JS se parse. -->
  <link rel="preconnect" href="https://lgonxzrzjcqthjtbdpzo.supabase.co" crossorigin />
  <!-- Police chargée SANS bloquer l'affichage : la page s'affiche tout de suite
       avec la police système, puis bascule sur Inter une fois prête (display=swap).
       Le média « print » rend le lien non-bloquant, l'onload le réactive. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
  <title>VRM</title>
  <style>
    body{margin:0;padding:0;background:#eef2ef;font-family:'Inter','SF Pro Text',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
    /* Le fond n'est plus uniforme : un dégradé très léger vers le haut donne de
       la matière derrière les cartes blanches. À peine perceptible isolément,
       mais c'est ce qui fait la différence entre « feuille de papier » et
       « écran d'application ». */
    body{background-image:linear-gradient(180deg,#f4f7f5 0%,#eef2ef 420px);background-repeat:no-repeat;background-attachment:fixed;}
    @media (prefers-color-scheme: dark){ body{background:#0b0f0d;background-image:linear-gradient(180deg,#111815 0%,#0b0f0d 420px);} }
    *{-webkit-tap-highlight-color:transparent;}
    @keyframes cancaleSkeleton{0%{background-position:100% 50%}100%{background-position:0 50%}}

    /* ── FINITIONS « PREMIUM », valables sur TOUS les écrans ─────────────────
       Ces règles agissent globalement, sans toucher aux styles de chaque écran. */

    /* 1) CHIFFRES ALIGNÉS : les montants et compteurs utilisent des chiffres de
          largeur fixe → les colonnes ne « dansent » plus d'une ligne à l'autre.
          C'est le détail qui distingue une vraie app d'un prototype. */
    body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv05" 1,"ss01" 1;}

    /* 2) RÉPONSE AU TOUCHER : léger enfoncement au clic, comme une app native. */
    button,a[role="button"]{transition:transform .12s cubic-bezier(.32,.72,0,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease;}
    button:active:not(:disabled),a[role="button"]:active{transform:scale(.975);}

    /* 3) TITRES : un poil resserrés, ça pose la hiérarchie. */
    h1,h2,h3{letter-spacing:-.02em;}

    /* 4) DÉFILEMENT : élastique sur iOS + barres discrètes sur desktop. */
    html{-webkit-text-size-adjust:100%;}
    body{overscroll-behavior-y:none;}
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-thumb{background:rgba(120,140,130,.34);border-radius:999px;border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(120,140,130,.5);border:3px solid transparent;background-clip:content-box;}
    ::-webkit-scrollbar-track{background:transparent;}

    /* 5) SÉLECTION de texte aux couleurs de la marque. */
    ::selection{background:rgba(15,107,79,.18);}

    /* 6) CHAMPS DE SAISIE : jamais de zoom auto sur iOS (police >= 16px au focus)
          et un anneau propre — les champs trop petits font « site web », pas « app ». */
    /* Les boutons et champs n'héritent PAS de la police par défaut en HTML :
       sans cette règle, certains gardaient la police système et juraient au
       milieu du reste. */
    button,input,textarea,select{font-family:inherit;}
    @supports (-webkit-touch-callout: none){
      input,textarea,select{font-size:max(16px,1em);}
    }

    /* 7) CHANGEMENT D'ONGLET : le contenu arrive en fondu au lieu d'apparaître
          brutalement — discret, mais c'est ce qui fait « app » plutôt que « site ».
          ⚠️ On anime UNIQUEMENT l'opacité, jamais transform : un transform sur un
          conteneur redéfinit le référentiel des enfants en position:fixed, ce qui
          décalerait les modales. */
    @keyframes cancaleEnter{from{opacity:0}to{opacity:1}}
    /* Arrivée des notifications : léger glissement depuis le bas. */
    @keyframes cancaleToast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    /* Feuille de confirmation : elle monte depuis le bas, comme une feuille iOS,
       au lieu d'apparaître d'un coup au milieu de l'écran. */
    @keyframes cancaleSheet{from{transform:translateY(100%)}to{transform:none}}
    main > *{animation:cancaleEnter .24s ease both;}

    /* 8) IMAGES : jamais déformées, et fondu à l'arrivée plutôt qu'un « pop ». */
    img{max-width:100%;}
    @keyframes cancaleFadeIn{from{opacity:0}to{opacity:1}}
    img[loading="lazy"]{animation:cancaleFadeIn .25s ease both;}

    /* Accessibilité : anneau de focus visible seulement au clavier (pas au clic). */
    :focus-visible{outline:2.5px solid #0f6b4f;outline-offset:2px;border-radius:8px;}
    button:focus:not(:focus-visible),a:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible){outline:none;}
    /* Respect du réglage système « réduire les animations ». */
    @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}button:active:not(:disabled){transform:none!important;}}
  </style>
</head>
<body><div id="root"></div>
<!-- Densité d'affichage (Réglages → Affichage). Appliquée AVANT le chargement
     de l'app : sinon la page s'affiche à 100 % puis saute de taille sous les
     yeux de l'utilisateur à chaque ouverture. -->
<script>try{var z=localStorage.getItem('vrm_zoom'),f=parseFloat(z);
if(f&&f!==1){var d=document.documentElement,w=d.clientWidth;d.style.zoom=z;d.style.minWidth=Math.round(w/f)+'px';}}catch(e){}</script>
<script type="module" src="/src/main.jsx"></script></body>
</html>

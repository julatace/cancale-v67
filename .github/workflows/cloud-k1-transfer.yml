name: Transfer tested Cloud K1 patch
on:
  push:
    branches: ['claude/codex-ebay']
    paths: ['docs/passation/cloud-k1-transfer.patch']
permissions:
  contents: write
concurrency:
  group: cloud-k1-transfer
  cancel-in-progress: false
jobs:
  apply-tested-patch:
    if: github.repository == 'julatace/cancale-v67' && github.ref == 'refs/heads/claude/codex-ebay'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply patch and verify exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "498b7f9ba9b7a563627c5e2afd6448d62f9a9544"
          git apply --index docs/passation/cloud-k1-transfer.patch
          git rm .github/workflows/cloud-k1-transfer.yml docs/passation/cloud-k1-transfer.patch
          test "$(git write-tree)" = "25d369d876706639d40e419f1bef33f5ec72eab2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist per-account Vinted publication freezes and explicit sale links"
          git push origin HEAD:refs/heads/claude/codex-ebay

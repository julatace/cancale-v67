name: Parcours critiques VRM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: parcours-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comptes-et-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # (27 nov.) +30 min : le dernier pas lance TOUS les tests scripts/tests/*.cjs
    steps:
      - uses: actions/checkout@v4
      # (11 nov.) La garde réseau : un banc qui joint un vrai serveur (la production, Internet) est ROUGE.
      # (11 nov., ci-vert) Posée APRÈS le checkout : au niveau du job, NODE_OPTIONS chargeait le fichier
      # avant qu'il existe et `actions/checkout` lui-même plantait (« Cannot find module »).
      # (26 nov., zero-rouge-bancs) GitHub REFUSE NODE_OPTIONS par $GITHUB_ENV (« Can't store NODE_OPTIONS output
      # parameter ») : la garde n'était posée nulle part ici. Elle passe par l'`env:` de CHAQUE pas `run:` qui suit (jamais
      # au niveau du job : actions/checkout tomberait, le fichier n'existe pas encore).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - run: node scripts/audit-parcours-production.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - run: npm run build
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Installer le navigateur de contrôle
        run: |
          bash scripts/ci-installer-navigateurs.sh chromium   # sans la source apt de Microsoft, 4 essais (scripts/ci-installer-navigateurs.sh)
          # Des bancs visent /opt/pw-browsers/chromium (le conteneur des sessions), comme dans verifier.yml.
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(node -e 'console.log(require("playwright").chromium.executablePath())')" /opt/pw-browsers/chromium
          echo "VRM_CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      # (11 nov.) La garde réseau : un banc qui joint un vrai serveur (la production, Internet) est ROUGE.
      # Posée APRÈS le checkout et les téléchargements (agent2-cloisonnement) : au niveau du job, le
      # `--require` d'un fichier pas encore extrait faisait tomber actions/checkout (« Cannot find
      # module …/_garde-reseau.cjs ») — le job était rouge en 7 s sur main depuis #1133.
      # (26 nov., zero-rouge-bancs) GitHub REFUSE NODE_OPTIONS par $GITHUB_ENV (« Can't store NODE_OPTIONS output
      # parameter ») : la garde n'était posée nulle part ici. Elle passe par l'`env:` de CHAQUE pas `run:` qui suit (jamais
      # au niveau du job : actions/checkout tomberait, le fichier n'existe pas encore).
      - name: Vérifier la garde réseau des bancs (aucun banc ne joint la production)
        run: node scripts/tests/garde-reseau.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier récupération et fermeture de l'espace privé
        run: |
          node scripts/bancs/recuperation-auth.cjs
          node scripts/bancs/recuperation-retour.cjs
          node scripts/tests/recuperation-pannes-interface.cjs
          node scripts/bancs/confidentialite.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier le renouvellement des sessions
        run: |
          node --test scripts/tests/session-renouvellement.test.mjs
          node scripts/bancs/session-reveil.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la connexion autonome Orion
        run: |
          node scripts/tests/orion-auth-autonome.cjs
          node scripts/tests/orion-connexion.cjs
          node scripts/tests/orion-paquet.cjs
          node scripts/tests/orion-cors-reel.cjs
          node scripts/audit-garde-fous-capture.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier le périmètre des numéros Vinted
        run: node scripts/tests/numeros-vinted-perimetre-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier l’espace emails
        run: |
          node scripts/tests/espace-emails-interface.cjs
          node scripts/tests/journal-email-reessai.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier le guide de transfert
        run: node scripts/tests/transfert-guide-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la réception multi-comptes
        run: node scripts/tests/reception-synthese-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la synchronisation Vinted
        run: node scripts/tests/synchronisation-vinted-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier les outils des annonces
        run: node scripts/tests/outils-articles-vinted-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier le bilan de synchronisation
        run: node scripts/tests/bilan-synchronisation-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier les relectures de conversation
        run: node scripts/tests/conversation-relecture-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier les brouillons des annonces
        run: node scripts/tests/atelier-brouillon-fiable-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier l’historique des favoris
        run: node scripts/tests/favoris-historique-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la file des favoris
        run: node scripts/tests/favoris-automatisation-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier l’inscription
        run: node scripts/bancs/inscription-fiable.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la connexion
        run: |
          node --test scripts/tests/connexion-session.test.mjs scripts/tests/connexion-moyens.test.mjs
          node scripts/bancs/connexion-claire.cjs
          node scripts/tests/connexion-actions-interface.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier les captures de messagerie
        run: VRM_MESSAGES_LIVE_ONLY=1 node scripts/bancs/messagerie.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier la recherche des messages
        run: VRM_MESSAGES_SEARCH_ONLY=1 node scripts/bancs/messagerie.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Préparer le moteur PDF de contrôle
        run: |
          # (26 nov., zero-rouge-bancs) Un seul essai vers jsDelivr faisait tomber le job (« curl: (35) TLS connect error … unexpected
          # eof », #1433). Source : le paquet npm (registry.npmjs.org, celui de npm ci, réessais de npm) — mêmes fichiers, mêmes
          # empreintes (vérifié le 26 nov.) ; secours : jsDelivr, avec réessais. L'empreinte juge toujours ce qui est posé.
          mkdir -p "$RUNNER_TEMP/vrm-pdfjs" "$RUNNER_TEMP/vrm-pdfjs-paquet"
          if (cd "$RUNNER_TEMP/vrm-pdfjs-paquet" && npm pack pdfjs-dist@3.11.174 --silent && tar -xzf pdfjs-dist-3.11.174.tgz package/build/pdf.min.js package/build/pdf.worker.min.js); then
            cp "$RUNNER_TEMP/vrm-pdfjs-paquet/package/build/pdf.min.js" "$RUNNER_TEMP/vrm-pdfjs-paquet/package/build/pdf.worker.min.js" "$RUNNER_TEMP/vrm-pdfjs/"
          else
            for f in pdf.min.js pdf.worker.min.js; do
              curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/$f" --output "$RUNNER_TEMP/vrm-pdfjs/$f"
            done
          fi
          (cd "$RUNNER_TEMP/vrm-pdfjs" && sha256sum -c "$GITHUB_WORKSPACE/scripts/pdfjs-test.sha256")
          echo "VRM_PDFJS_DIR=$RUNNER_TEMP/vrm-pdfjs" >> "$GITHUB_ENV"
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier le placement et la lecture des QR après tampon
        run: |
          node scripts/tests/bordereau-zone-protegee.cjs
          BANC_PDFJS_DIR="$VRM_PDFJS_DIR" node scripts/bancs/tampon-bordereau.cjs
          node scripts/tests/bordereau-qr-lecture.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      - name: Vérifier les politiques SQL sur une base jetable
        run: |
          bash scripts/ci-sans-source-microsoft.sh   # « 403 … no longer signed » de packages.microsoft.com (PR #1437)
          sudo apt-get update
          sudo apt-get install -y postgresql
          node scripts/audit-confidentialite-sql.cjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs
      # (27 nov., tests-unitaires-verts) TOUS les tests scripts/tests/*.cjs (sauf les modules « _… »), pas une liste choisie :
      # la moitié n'était lancée par aucun workflow et 30 étaient rouges sur main sans que personne ne le voie. Ce job a déjà
      # dist/, Chromium (VRM_CHROMIUM_PATH), pdf.js (VRM_PDFJS_DIR) et la garde réseau. Chaque test est lancé, un rouge ne
      # cache pas les suivants, et le pas est rouge s'il en reste un.
      - name: Tous les tests scripts/tests/*.cjs
        run: |
          rouges=""
          for t in scripts/tests/[!_]*.cjs; do
            echo "::group::$t"
            node "$t" || rouges="$rouges $t"
            echo "::endgroup::"
          done
          if [ -n "$rouges" ]; then echo "Rouges :$rouges"; exit 1; fi
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/bancs/_garde-reseau.cjs

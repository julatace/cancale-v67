name: Parcours critiques VRM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: parcours-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comptes-et-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/audit-parcours-production.mjs
      - run: npm run build
      - name: Installer le navigateur de contrôle
        run: |
          npx playwright install --with-deps chromium
          echo "VRM_CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Vérifier récupération et fermeture de l'espace privé
        run: |
          node scripts/bancs/recuperation-auth.cjs
          node scripts/bancs/recuperation-retour.cjs
          node scripts/tests/recuperation-pannes-interface.cjs
          node scripts/bancs/confidentialite.cjs
      - name: Vérifier le renouvellement des sessions
        run: |
          node --test scripts/tests/session-renouvellement.test.mjs
          node scripts/bancs/session-reveil.cjs
      - name: Vérifier le périmètre des numéros Vinted
        run: node scripts/tests/numeros-vinted-perimetre-interface.cjs
      - name: Vérifier l’espace emails
        run: node scripts/tests/espace-emails-interface.cjs
      - name: Vérifier le guide de transfert
        run: node scripts/tests/transfert-guide-interface.cjs
      - name: Vérifier la réception multi-comptes
        run: node scripts/tests/reception-synthese-interface.cjs
      - name: Vérifier la synchronisation Vinted
        run: node scripts/tests/synchronisation-vinted-interface.cjs
      - name: Vérifier les outils des annonces
        run: node scripts/tests/outils-articles-vinted-interface.cjs
      - name: Vérifier le bilan de synchronisation
        run: node scripts/tests/bilan-synchronisation-interface.cjs
      - name: Vérifier les relectures de conversation
        run: node scripts/tests/conversation-relecture-interface.cjs
      - name: Vérifier les brouillons des annonces
        run: node scripts/tests/atelier-brouillon-fiable-interface.cjs
      - name: Vérifier l’historique des favoris
        run: node scripts/tests/favoris-historique-interface.cjs
      - name: Vérifier la file des favoris
        run: node scripts/tests/favoris-automatisation-interface.cjs
      - name: Vérifier l’inscription
        run: node scripts/bancs/inscription-fiable.cjs
      - name: Vérifier la connexion
        run: |
          node --test scripts/tests/connexion-session.test.mjs scripts/tests/connexion-moyens.test.mjs
          node scripts/bancs/connexion-claire.cjs
          node scripts/tests/connexion-actions-interface.cjs
      - name: Vérifier les captures de messagerie
        run: VRM_MESSAGES_LIVE_ONLY=1 node scripts/bancs/messagerie.cjs
      - name: Vérifier la recherche des messages
        run: VRM_MESSAGES_SEARCH_ONLY=1 node scripts/bancs/messagerie.cjs
      - name: Préparer le moteur PDF de contrôle
        run: |
          mkdir -p "$RUNNER_TEMP/vrm-pdfjs"
          curl --fail --silent --show-error https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js --output "$RUNNER_TEMP/vrm-pdfjs/pdf.min.js"
          curl --fail --silent --show-error https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js --output "$RUNNER_TEMP/vrm-pdfjs/pdf.worker.min.js"
          (cd "$RUNNER_TEMP/vrm-pdfjs" && sha256sum -c "$GITHUB_WORKSPACE/scripts/pdfjs-test.sha256")
          echo "VRM_PDFJS_DIR=$RUNNER_TEMP/vrm-pdfjs" >> "$GITHUB_ENV"
      - name: Vérifier le placement et la lecture des QR après tampon
        run: |
          node scripts/tests/bordereau-zone-protegee.cjs
          node scripts/tests/bordereau-rendu-blanc.cjs
          node scripts/tests/bordereau-qr-lecture.cjs
      - name: Vérifier les politiques SQL sur une base jetable
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          node scripts/audit-confidentialite-sql.cjs

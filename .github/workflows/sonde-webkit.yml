name: Sonde WebKit (temporaire)
on:
  push:
    branches: [claude/sonde-webkit]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer WebKit
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-vrm-retries >/dev/null
          for essai in 1 2 3; do npx playwright install --with-deps webkit && break; sleep 20; done
      - name: B5 sous WebKit, app de MAIN (même banc)
        env:
          NAVIGATEUR: webkit
          BANC_PARTIE: B
        run: |
          git show origin/main:src/App.jsx > /tmp/App-apres.jsx; cp src/App.jsx /tmp/App-apres.jsx
          git show origin/main:src/App.jsx > src/App.jsx && npm run build >/dev/null
          for i in 1 2 3; do BANC_PORT=$((10100+i)) node scripts/bancs/iphone-reprise.cjs 2>&1 | grep -E "B5|❌" ; done || true
          cp /tmp/App-apres.jsx src/App.jsx
      - name: B5 sous WebKit, app CORRIGÉE (même banc)
        env:
          NAVIGATEUR: webkit
          BANC_PARTIE: B
        run: |
          npm run build >/dev/null
          for i in 1 2 3; do BANC_PORT=$((10200+i)) node scripts/bancs/iphone-reprise.cjs 2>&1 | grep -E "B5|❌" ; done || true

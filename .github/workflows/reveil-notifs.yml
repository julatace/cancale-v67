name: Récapitulatif au réveil (heures calmes)
# (5 nov.) Le plan gratuit de Vercel ne lance une tâche planifiée qu'une fois
# par jour. Le récapitulatif de ce qui est arrivé pendant les heures calmes doit
# partir à la FIN de celles-ci (réglée par chaque vendeur) : GitHub appelle donc
# la route toutes les 30 minutes le matin. La route décide seule (fenêtre de
# 3 h après la fin des heures calmes, un seul récapitulatif par jour).
# Sans le secret `CRON_SECRET` dans GitHub (Settings → Secrets and variables →
# Actions), rien n'est appelé et le journal le dit.
on:
  schedule:
    - cron: '7,37 3-11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la route du réveil
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET absent des secrets GitHub : aucun récapitulatif n'est demandé."
            exit 0
          fi
          code=$(curl -sS -o reponse.json -w '%{http_code}' -m 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vrm.center/api/ship-reminders?moment=reveil")
          echo "HTTP $code"
          node -e "const r=require('./reponse.json'); console.log(JSON.stringify({ok:r.ok,vendeurs:r.vendeurs,echecs:r.echecs,reveils:(r.bilans||[]).map(b=>b.reveil)}))" || true
          test "$code" = "200"

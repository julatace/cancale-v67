name: Vérifier avant fusion
# (6 nov., filet 1 « l'app ne bug jamais ») Sur chaque PR vers main : la
# construction, TOUS les audits (scripts/lancer-audits.cjs, en trois parts
# parallèles), un lot de bancs principaux sur l'app RENDUE (Chromium), et les
# mêmes bancs sous WebKit (le moteur de Safari, non bloquant au début).
# Aucun secret, aucune donnée réelle, rien n'est écrit en production : les
# audits et les bancs servent une fausse base et des données INVENTÉES.
# Les rouges CONNUS hors périmètre sont listés, avec leur raison et leur date,
# dans scripts/audits-exceptions.json (lancés quand même, rapportés).
# Pour que ce contrôle BLOQUE une fusion : règle de protection de la branche
# `main` (pas-à-pas : docs/passation/2026-11-06-filets-anti-bug.md).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 2

  audits:
    name: Audits (part ${{ matrix.part }}/3)
    needs: construire
    # (13 nov.) Épinglé comme base-essai.yml et sauvegarde.yml : le 13 nov. vers 4 h UTC, `ubuntu-latest` est passé
    # à Ubuntu 26 (autre Postgres) et les audits SQL (base-essai, socle 018-020) sont tombés sur toutes les PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # Toute l'histoire, `origin/main` compris : des audits comparent aux versions
          # d'extension PUBLIÉES (scripts/_versions-publiees.cjs, audit-extension-zip,
          # audit-republier --prouve lit l'arbre d'origin/main).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Installer Chromium (audits qui exécutent une page) et Postgres (audits SQL)
        run: |
          # (11 nov., ci-vert) Les miroirs apt d'Ubuntu échouent parfois (« Temporary failure resolving ») :
          # tous les jobs de la PR #1131 sont tombés là, aucun contrôle lancé. Réessais bornés, puis rouge.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-vrm-retries >/dev/null
          for essai in 1 2 3 4; do npx playwright install --with-deps chromium && break; [ "$essai" = 4 ] && exit 1; sleep $((essai * 20)); sudo apt-get update || true; done
          # Les audits et les bancs visent /opt/pw-browsers/chromium (le conteneur des sessions).
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(node -e 'console.log(require("playwright").chromium.executablePath())')" /opt/pw-browsers/chromium
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
          # (11 nov., lot export-comptable) audit-export-zip relit le .xlsx avec openpyxl (python3 -I : paquet système, pas --user).
          python3 -I -c 'import openpyxl' 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-openpyxl)
      - name: Lancer les audits
        env:
          AUDITS_PART: ${{ matrix.part }}/3
          AUDITS_PARALLELE: '4'
          AUDITS_TIMEOUT_S: '900'
        run: node scripts/lancer-audits.cjs
      - name: Remettre public/ comme il était (des audits régénèrent les zips)
        if: always()
        run: git checkout -- public/ && git status --short

  bancs:
    name: Bancs principaux (Chromium, part ${{ matrix.part }}/3)
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # nouveau-vendeur seul : le plus long (chaque écran, 2 largeurs, 2 thèmes).
          - part: 1
            lot: nouveau-vendeur garde-ecrans
          # budget-vitesse (11 nov.) : lectures, octets, doublons, lignes entières et JS par
          # écran principal, contre scripts/budget-vitesse.json (~5 min).
          - part: 2
            lot: navigation-tache ventes-e2 journee-coherence morceau-perime statut-colis budget-vitesse accessibilite
          - part: 3
            lot: colis-retirer-propre annonces-actions iphone-reprise argent-mois chiffres-coherents retraits-suivi accessibilite-clavier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Installer Chromium
        run: |
          # (11 nov., ci-vert) Les miroirs apt d'Ubuntu échouent parfois (« Temporary failure resolving ») :
          # tous les jobs de la PR #1131 sont tombés là, aucun contrôle lancé. Réessais bornés, puis rouge.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-vrm-retries >/dev/null
          for essai in 1 2 3 4; do npx playwright install --with-deps chromium && break; [ "$essai" = 4 ] && exit 1; sleep $((essai * 20)); sudo apt-get update || true; done
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(node -e 'console.log(require("playwright").chromium.executablePath())')" /opt/pw-browsers/chromium
          echo "VRM_CHROMIUM_PATH=/opt/pw-browsers/chromium" >> "$GITHUB_ENV"
      - name: Lancer les bancs
        env:
          BANCS_PORT_BASE: '10000'
        run: node scripts/lancer-bancs.cjs ${{ matrix.lot }}

  bancs-webkit:
    # (6 nov., filet 6) Safari : des bancs sous WebKit. NON BLOQUANT au début
    # (continue-on-error) : on apprend d'abord ce que WebKit voit de différent ;
    # à rendre bloquant quand il est vert plusieurs fois de suite (la passation le dit).
    # (11 nov., webkit-fiable) + les parcours critiques sur iPhone : connexion, Ma journée,
    # Ventes, colis à retirer et leur suivi, impression des bordereaux. Le faux Supabase
    # des bancs sert le CORS sous WebKit (_navigateur.cjs) ; nouveau-vendeur ne joue que
    # 390 px (l'iPhone ; 1512 reste dans les bancs Chromium). Récit :
    # docs/passation/2026-11-11-webkit-fiable.md. Pour le rendre BLOQUANT : retirer
    # `continue-on-error: true` ci-dessous (après trois passages verts sans changement).
    name: Bancs sous WebKit (Safari, non bloquant)
    needs: construire
    # (13 nov., integration-13nov-ci) Épinglé comme les audits : `ubuntu-latest` est passé à Ubuntu 26
    # le 13 nov. vers 4 h UTC ; le WebKit de Playwright est construit pour 24.04. Sa vraie panne était
    # ailleurs (service worker hors des routes sous WebKit : scripts/bancs/_garde-reseau.cjs).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Installer WebKit
        run: |
          # (11 nov., ci-vert) Les miroirs apt d'Ubuntu échouent parfois (« Temporary failure resolving ») :
          # tous les jobs de la PR #1131 sont tombés là, aucun contrôle lancé. Réessais bornés, puis rouge.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-vrm-retries >/dev/null
          for essai in 1 2 3 4; do npx playwright install --with-deps webkit && break; [ "$essai" = 4 ] && exit 1; sleep $((essai * 20)); sudo apt-get update || true; done
      - name: Lancer les bancs sous WebKit
        env:
          NAVIGATEUR: webkit
          BANCS_PORT_BASE: '10030'
          BANCS_TIMEOUT_S: '1800'
          LARGEURS: '390'
        run: node scripts/lancer-bancs.cjs connexion-claire journee-coherence ventes-e2 colis-retirer-propre retraits-suivi tout-imprimer iphone-reprise nouveau-vendeur

  e2e-extension:
    # (11 nov.) L'APP ET LA VRAIE EXTENSION ENSEMBLE : un vrai Chromium (nouveau
    # headless, le binaire COMPLET — le « headless shell » ne charge pas
    # d'extension), la vraie extension MV3 chargée depuis son dossier, le vrai
    # dist/, un faux vinted.fr et un faux Supabase servis en local sous leurs vrais
    # noms (rien ne sort). Six scénarios : liaison, dressing ⇒ Annonces, vente ⇒
    # Ventes, baisse de prix commandée par l'app (compte de l'onglet, plafond, 429),
    # autre compte dans l'onglet, extension en retard. NON BLOQUANT au début
    # (continue-on-error) : à rendre bloquant après plusieurs passages verts de suite
    # sur GitHub (docs/passation/2026-11-11-e2e-extension.md).
    name: App + vraie extension (Chromium, non bloquant)
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Installer Chromium
        run: |
          # (11 nov., ci-vert) Les miroirs apt d'Ubuntu échouent parfois (« Temporary failure resolving ») :
          # tous les jobs de la PR #1131 sont tombés là, aucun contrôle lancé. Réessais bornés, puis rouge.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-vrm-retries >/dev/null
          for essai in 1 2 3 4; do npx playwright install --with-deps chromium && break; [ "$essai" = 4 ] && exit 1; sleep $((essai * 20)); sudo apt-get update || true; done
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(node -e 'console.log(require("playwright").chromium.executablePath())')" /opt/pw-browsers/chromium
          echo "VRM_CHROMIUM_PATH=/opt/pw-browsers/chromium" >> "$GITHUB_ENV"
      - name: Lancer le banc e2e-extension
        env:
          BANC_PORT: '10060'
          BANC_CAPTURE: e2e-captures
        run: node scripts/bancs/e2e-extension.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-extension-captures
          path: e2e-captures
          retention-days: 5
          if-no-files-found: ignore

name: Reprise des chantiers VRM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reprise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier les parcours et changements de propriétaire
        run: |
          node --test scripts/tests/parcours-clairs.test.mjs scripts/tests/periode-libelles.test.mjs scripts/tests/plateformes-affichage.test.mjs
          node scripts/tests/lot-preparation-reprise.cjs
          node scripts/tests/guide-reception-isolation.cjs
      - name: Vérifier les archives portables des extensions
        run: |
          python3 scripts/tests/paquets-portables.py
          python3 scripts/tests/orion-reference.py
          python3 scripts/tests/orion-base-validee.py
          python3 scripts/tests/orion-garde-regression.py
      - name: Vérifier les calculs, le handler et les changements de session
        run: |
          node --test scripts/tests/finance-reprise.test.mjs scripts/tests/appareils-route.test.mjs scripts/tests/deconnexion-proprietaire.test.mjs scripts/tests/parcours-quotidien.test.mjs scripts/tests/bordereau-vestiaire-ouverture.test.mjs
          for audit in argent-a-venir comparer-mois frais-plateformes journal-semaine objectif-mois questions-ebay stats-offres achats-sourcing comptes-securite selection-bordereaux; do
            node "scripts/audit-$audit.cjs"
          done
  # (24 nov., ci-rapide) dist/ construit UNE fois pour les 7 écrans (avant : `npm run build`
  # dans chacun, ~1 min × 7). Même commande, même arbre, partagé comme dans verifier.yml.
  construire-ecrans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ecrans
          path: dist
          retention-days: 2
  ecrans:
    needs: construire-ecrans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        banc: [argent-mois, offres-objectif, achats-sourcing, comptes-securite, bureau-chargement, parcours-quotidien, bordereau-vestiaire-ouverture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-ecrans
          path: dist
      - name: Installer Chromium
        run: |
          bash scripts/ci-installer-navigateurs.sh chromium   # sans la source apt de Microsoft, 4 essais (scripts/ci-installer-navigateurs.sh)
          # Des bancs visent /opt/pw-browsers/chromium (le conteneur des sessions), comme dans verifier.yml.
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(node -e 'console.log(require("playwright").chromium.executablePath())')" /opt/pw-browsers/chromium
          echo "VRM_CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Vérifier les écrans sur données fictives
        env:
          NODE_OPTIONS: --require=./scripts/bancs/_porte-banc.cjs --require=./scripts/bancs/_garde-reseau.cjs
        run: |
          node scripts/bancs/${{ matrix.banc }}.cjs
          if [ "${{ matrix.banc }}" = "parcours-quotidien" ]; then
            node scripts/tests/synchronisation-vinted-interface.cjs
            node scripts/tests/actions-visuelles-interface.cjs
            node scripts/tests/recherche-interactions.cjs
            node scripts/tests/controles-finitions-interface.cjs
            node scripts/tests/fenetres-interruptions.cjs
            node scripts/tests/periode-affichage-focus.cjs
            node scripts/tests/choix-plateformes.cjs
            node scripts/tests/navigation-plateformes.cjs
          fi

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    /* « VRM Noir » — la famille de l'app (§7) : UN seul accent bleu, rare ; le
       clair et le sombre suivent le système ; rayons 5 / 8 / 10 / 12 ; une
       seule forme de bouton (44 px). 5.191 : CSS seulement, aucune logique. */
    :root { color-scheme: dark light;
      --fond: #07090D; --carte: #10141B; --bord: #1E2530; --texte: #E8ECF2; --doux: #8A93A3;
      --accent: #3D7BFF; --ambre: #F5A524; --survol: #1A202A; }
    @media (prefers-color-scheme: light) {
      :root { --fond: #F4F6FA; --carte: #FFFFFF; --bord: #DCE1EA; --texte: #10151B; --doux: #5B6577;
        --accent: #2458E6; --ambre: #A15C00; --survol: #EEF1F6; }
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; width: 300px; margin: 0; padding: 16px;
      background: var(--fond); color: var(--texte); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
    body.carte { width: auto; min-height: 100vh; padding: 16px 16px 14px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    body.carte .head { padding-right: 44px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: block; box-shadow: 0 0 0 1px rgba(61,123,255,.38); }
    h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--doux); flex-shrink: 0; }
    .dot.warn { background: var(--ambre); }
    .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    button { display: block; width: 100%; margin-top: 12px; padding: 0 14px; min-height: 44px; border: 1px solid transparent; border-radius: 8px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; line-height: 1.2; cursor: pointer; font-family: inherit;
      transition: filter .12s ease, background .12s ease; }
    button:hover { filter: brightness(1.06); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: default; }
    button.sec { background: transparent; color: var(--texte); border-color: var(--bord); margin-top: 8px; }
    button.sec:hover { background: var(--survol); filter: none; }
    .muted { font-size: 12px; color: var(--doux); margin-top: 10px; line-height: 1.5; }
    .muted a { color: var(--accent); }
    #mdpLien { display: inline-flex; align-items: center; min-height: 44px; }
    .muted b { color: var(--texte); }
    input { width: 100%; margin-top: 8px; padding: 0 12px; min-height: 44px; border-radius: 8px;
      border: 1px solid var(--bord); background: var(--carte); color: var(--texte); font: inherit; font-size: 14px; outline: none; }
    input::placeholder { color: var(--doux); }
    input:focus { border-color: var(--accent); }
    .err { font-size: 12px; color: var(--ambre); margin-top: 8px; line-height: 1.45; }
    .who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--carte); }
    /* L'icône OUVRE VRM (30 sept.). La fenêtre ne sert qu'à se connecter : tant
       qu'on ne sait pas, on ne montre que le logo. */
    body.decide #auth { display: none; }
  </style>
</head>
<body class="decide">
  <div class="head">
    <img class="logo" src="logo-vrm-96.png" alt="VRM">
    <h1>Connexion à VRM</h1>
  </div>
  <div id="auth"></div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    /* « VRM Noir » — la famille de l'app (§7) : sombre, UN seul accent bleu.
       L'ancien logo doré et la menthe sont partis (2 octobre). */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; width: 300px; margin: 0; padding: 16px;
      background: #07090D; color: #E8ECF2; font-size: 12.5px; }
    body.carte { width: auto; min-height: 100vh; padding: 16px 16px 14px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .logo { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: block; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
    .dot { width: 7px; height: 7px; border-radius: 999px; background: #8A93A3; flex-shrink: 0; }
    .dot.warn { background: #F5A524; }
    .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    button { width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 8px; background: #3D7BFF; color: #fff;
      font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; min-height: 38px; }
    button:disabled { opacity: .6; cursor: default; }
    .muted { font-size: 11px; color: #8A93A3; margin-top: 10px; line-height: 1.5; }
    .muted a { color: #3D7BFF; }
    input { width: 100%; margin-top: 8px; padding: 9px 10px; border-radius: 8px;
      border: 1px solid #1E2530; background: #10141B; color: #E8ECF2; font: inherit; font-size: 12.5px; outline: none; }
    input:focus { border-color: #3D7BFF; }
    button.sec { background: transparent; color: #8A93A3; border: 1px solid #1E2530; font-weight: 600; margin-top: 8px; }
    .err { font-size: 11.5px; color: #F5A524; margin-top: 8px; line-height: 1.45; }
    .who { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
    /* L'icône OUVRE VRM (30 sept.). La fenêtre ne sert qu'à se connecter : tant
       qu'on ne sait pas, on ne montre que le logo. */
    body.decide #auth { display: none; }
  </style>
</head>
<body class="decide">
  <div class="head">
    <img class="logo" src="logo-vrm-96.png" alt="VRM">
    <h1>Connexion à VRM</h1>
  </div>
  <div id="auth"></div>
  <script src="popup.js"></script>
</body>
</html>

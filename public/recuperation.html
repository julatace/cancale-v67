<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Nouveau mot de passe · VRM</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/recuperation.css">
<script src="/recuperation.js" type="module"></script>
</head>
<body>
<div class="r">
 <header class="r-marque">
  <a class="r-logo" href="/" aria-label="VRM — ouvrir l’app"><img src="/vrm-logo-v5-192.png" alt="" width="36" height="36"><b>VRM</b></a>
  <p class="r-titre">Ton compte VRM.<span>Un nouveau mot de passe en une minute.</span></p>
 </header>
 <main class="r-main">
  <section class="r-carte" aria-labelledby="titre">
   <h1 id="titre">Choisis un nouveau mot de passe</h1>
   <p id="message" role="status" aria-live="polite">Ouverture de ton lien…</p>

   <form id="nouveau" hidden novalidate>
    <label class="r-champ" for="password"><span>Nouveau mot de passe</span></label>
    <div class="r-secret">
     <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="regles">
     <button id="voir" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">Afficher</button>
    </div>
    <label class="r-champ" for="confirmation"><span>Confirme-le</span></label>
    <input id="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <ul id="regles" class="r-regles" aria-label="Conditions du mot de passe">
     <li id="r-longueur" data-valide="false">8 caractères minimum</li>
     <li id="r-melange" data-valide="false">Des lettres et des chiffres</li>
    </ul>
    <button class="r-primaire" type="submit">Enregistrer</button>
   </form>

   <div id="fait" hidden>
    <a id="ouvrir" class="r-primaire" href="/">Ouvrir VRM</a>
   </div>

   <button id="reessayer" class="r-primaire" type="button" hidden>Réessayer</button>

   <form id="renvoi" hidden novalidate>
    <label class="r-champ" for="email"><span>Ton adresse e-mail</span></label>
    <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254" required>
    <button class="r-primaire" type="submit">M’envoyer un nouvel e-mail</button>
   </form>

   <details id="autre" class="r-autre" hidden>
    <summary>J’ai un e-mail plus récent</summary>
    <form id="secours" novalidate>
     <label class="r-champ" for="lien"><span>Colle le lien de son bouton</span></label>
     <textarea id="lien" rows="3" autocomplete="off" spellcheck="false" placeholder="Appui long sur le bouton de l’e-mail → Copier le lien"></textarea>
     <button class="r-secondaire" type="submit">Utiliser ce lien</button>
    </form>
   </details>

   <a id="connexion" class="r-retour" href="/?connexion">Retour à la connexion</a>
  </section>
 </main>
</div>
</body>
</html>

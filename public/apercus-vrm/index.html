<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 mises en page pour VRM</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1b2c32;font:14px system-ui,sans-serif}header{padding:28px 32px 22px;background:white;border-bottom:1px solid #e1e7ea}.brand{font-size:24px;font-weight:850;letter-spacing:-1px;color:#087d6e}h1{font-size:29px;letter-spacing:-.7px;margin:14px 0 8px}header p{color:#657a83;margin:0;line-height:1.5}.controls{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}.controls button,.controls input{font:inherit;font-size:12px;padding:10px 14px;border:1px solid #dae3e8;border-radius:8px;background:white;color:#36515d;min-height:38px}.controls button{cursor:pointer}.controls button[aria-pressed=true]{background:#e9f5f1;border-color:#087d6e;color:#087d6e}.controls input{flex:1;max-width:380px}.controls span{color:#7d9098;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding:28px 32px}.tile{background:white;border:1px solid #e1e7ea;border-radius:13px;overflow:hidden;min-width:0}.tile a{display:block;color:inherit;text-decoration:none}.preview{padding:12px;background:#edf1f4;border-bottom:1px solid #e1e7ea}.preview img{display:block;width:100%;aspect-ratio:390/900;object-fit:contain;border-radius:6px;box-shadow:0 2px 8px #173c4210}.meta{padding:15px}.meta h2{font-size:15px;margin:0 0 7px;line-height:1.4;letter-spacing:-.2px}.meta b{color:#087d6e;margin-right:7px}.meta p{font-size:11px;color:#73878f;margin:0;line-height:1.5;min-height:34px}.meta span{display:block;font-size:11px;margin-top:10px;color:#087d6e}.tile:hover{border-color:#a4cfc2}.tile a:focus-visible{outline:3px solid #087d6e;outline-offset:-3px}body.desktop .preview img{aspect-ratio:1440/900}body.sheet .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:20px}body.sheet header{padding:20px}body.sheet h1{font-size:24px;margin:8px 0}body.sheet .controls{display:none}body.sheet .preview{padding:7px}footer{color:#82959b;font-size:11px;padding:0 32px 24px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){header{padding:22px 18px}h1{font-size:24px}.grid{padding:18px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{padding:7px}.meta{padding:11px}.meta h2{font-size:12px}.meta p{font-size:10px}.controls input{max-width:none;width:100%}}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style><header><div class="brand">vrm.</div><h1>20 mises en page à comparer</h1><p>Des organisations différentes, avec des boutons côte à côte et une version adaptée au téléphone.</p><div class="controls"><button id="phone" aria-pressed="true" onclick="displayMode(390)">Téléphone</button><button id="desktop" aria-pressed="false" onclick="displayMode(1440)">Ordinateur</button><input id="search" aria-label="Rechercher une mise en page" placeholder="Rechercher : grille, comptes, expédition…" oninput="renderGallery()"><span id="count"></span></div></header><main class="grid" id="gallery"></main><footer>Maquettes avec données et illustrations fictives. Aucun changement en production. Ouvre une proposition pour essayer ses filtres et ses boutons.</footer><script>const layouts=[{"id": "01", "name": "Liste compacte", "description": "Pour gérer rapidement les paires au quotidien"}, {"id": "02", "name": "Atelier contrasté", "description": "Navigation sombre et espace de travail lumineux"}, {"id": "03", "name": "Liste business", "description": "Lignes fines, prix et commandes bien alignés"}, {"id": "04", "name": "Grille de paires", "description": "Des petites fiches pour parcourir le catalogue"}, {"id": "05", "name": "Deux colonnes", "description": "Deux listes de travail sur grand écran"}, {"id": "06", "name": "Tableau de travail", "description": "Une ligne par paire, colonnes stables"}, {"id": "07", "name": "Liste et détail", "description": "La liste à gauche, un panneau de lecture à droite"}, {"id": "08", "name": "Suivi financier", "description": "Les résultats au premier plan, les paires juste après"}, {"id": "09", "name": "Chiffres sur le côté", "description": "Un rail de chiffres, une grande liste au centre"}, {"id": "10", "name": "Par compte", "description": "Séparer Bordeaux et Lyon dans la même vue"}, {"id": "11", "name": "Deux files de travail", "description": "À suivre et à ajuster, dans deux colonnes"}, {"id": "12", "name": "Fil d’activité", "description": "Les paires organisées comme un fil continu"}, {"id": "13", "name": "Catalogue photo", "description": "La photo prend davantage de place, sans empiler les actions"}, {"id": "14", "name": "Numéros de rangement", "description": "Le numéro devient le repère principal de la liste"}, {"id": "15", "name": "Par pointure", "description": "Retrouver les paires 42, 43 et 44 par groupes"}, {"id": "16", "name": "Filtres visibles", "description": "Un panneau de filtres prêt à l’emploi"}, {"id": "17", "name": "Sélection en lots", "description": "Sélectionner plusieurs paires dans une liste compacte"}, {"id": "18", "name": "Expédition en priorité", "description": "La vue commence par les colis à envoyer"}, {"id": "19", "name": "Navigation en haut", "description": "Plus de largeur disponible sur ordinateur"}, {"id": "20", "name": "Sections sur le côté", "description": "Sections verticales sur ordinateur, sélecteur compact sur téléphone"}];let mode=390;const serie=Number(new URLSearchParams(location.search).get('serie'))||0;if(serie){document.body.classList.add('sheet');document.querySelector('h1').textContent='Propositions '+((serie-1)*5+1)+' à '+(serie*5)}function displayMode(value){mode=value;document.body.classList.toggle('desktop',value===1440);phone.setAttribute('aria-pressed',value===390);desktop.setAttribute('aria-pressed',value===1440);renderGallery()}function renderGallery(){const q=search.value.toLocaleLowerCase('fr');const shown=layouts.filter((it,index)=>(!serie||(index>=(serie-1)*5&&index<serie*5))&&(!q||(it.name+' '+it.description).toLocaleLowerCase('fr').includes(q)));gallery.innerHTML=shown.map(it=>`<article class="tile"><a href="${it.id}.html"><div class="preview"><img src="${it.id}-${mode}.png" alt="Aperçu ${it.id} : ${it.name}"></div><div class="meta"><h2><b>${it.id}</b>${it.name}</h2><p>${it.description}</p><span>Ouvrir cette proposition →</span></div></a></article>`).join('');count.textContent=shown.length+' proposition'+(shown.length>1?'s':'')}renderGallery();</script></html>
